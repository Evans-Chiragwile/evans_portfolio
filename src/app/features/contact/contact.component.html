<div
    class="relative top-[82px] flex flex-col items-center content-center justify-start gap-0 h-min min-h-screen overflow-clip bg-[#f7f7f7]">
    <div
        class="relative flex w-full flex-none flex-row items-center gap-[10px] h-min overflow-clip px-[30px] py-[100px]">
        <!-- Inner -->
        <div class="relative flex flex-1 w-full max-w-[1400px] m-auto flex-col gap-[80px] h-min overflow-clip p-0">
            <!-- Title section -->
            <app-page-title label="Get In Touch" title="Let's build something great together"
                description="Have a project, idea, or opportunity in mind? I-m open to building meaningful digital products, collaborating on innovative ideas, and exploring new software engineering opportunities."></app-page-title>
            <!--  -->
            <div class="relative flex flex-col lg:flex-row w-full max-w-[1520px] m-auto gap-[50px]">

                <!-- Contact Information -->
                <div class="relative flex flex-col w-full lg:w-[420px] flex-none gap-[30px] sm:gap-[40px]">
                    <h3 class="text-[26px] sm:text-[30px] leading-[1.15em] tracking-[-0.03em] font-[500] text-black">
                        Contact Information</h3>

                    <div class="flex flex-col gap-[24px] sm:gap-[28px]">

                        <!-- Email -->
                        <div class="flex flex-col gap-[10px]">
                            <p class="text-[14px] leading-[1.2em] tracking-[-0.03em] font-[500] text-black">Email
                                Address</p>
                            <a href="mailto:hello@semono.com" class="group relative flex w-fit items-center gap-[10px]">
                                <span
                                    class="text-[15px] font-[500] tracking-[-0.03em] text-black/80">evanschiragwile@gmail.com</span>
                                <span
                                    class="relative flex items-center justify-center w-[32px] h-[32px] rounded-full bg-[#E4FE00] overflow-hidden flex-none">
                                    <svg class="h-[16px] w-[16px] transition-transform duration-300 group-hover:translate-x-1"
                                        viewBox="0 0 256 256" fill="#0F3D3A">
                                        <path
                                            d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z">
                                        </path>
                                    </svg>
                                </span>
                            </a>
                        </div>
                        <!-- Github -->
                        <div class="flex flex-col gap-[10px]">
                            <p class="text-[14px] leading-[1.2em] tracking-[-0.03em] font-[500] text-black">Github</p>
                            <a href="mailto:hello@semono.com" class="group relative flex w-fit items-center gap-[10px]">
                                <span
                                    class="text-[15px] font-[500] tracking-[-0.03em] text-black/80">evanschiragwile@gmail.com</span>
                                <span
                                    class="relative flex items-center justify-center w-[32px] h-[32px] rounded-full bg-[#E4FE00] overflow-hidden flex-none">
                                    <svg class="h-[16px] w-[16px] transition-transform duration-300 group-hover:translate-x-1"
                                        viewBox="0 0 256 256" fill="#0F3D3A">
                                        <path
                                            d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z">
                                        </path>
                                    </svg>
                                </span>
                            </a>
                        </div>
                        <!-- Phone -->
                        <div class="flex flex-col gap-[10px]">
                            <p class="text-[14px] leading-[1.2em] tracking-[-0.03em] font-[500] text-black">Phone Number
                            </p>
                            <a href="tel:+18004589214" class="group relative flex w-fit items-center gap-[10px]">
                                <span class="text-[15px] font-[500] tracking-[-0.03em] text-black/80">+255 699 822 956</span>
                                <span
                                    class="relative flex items-center justify-center w-[32px] h-[32px] rounded-full bg-[#E4FE00] overflow-hidden flex-none">
                                    <svg class="h-[16px] w-[16px] transition-transform duration-300 group-hover:translate-x-1"
                                        viewBox="0 0 256 256" fill="#0F3D3A">
                                        <path
                                            d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z">
                                        </path>
                                    </svg>
                                </span>
                            </a>
                        </div>

                        <!-- Location -->
                        <div class="flex flex-col gap-[10px]">
                            <p class="text-[14px] leading-[1.2em] tracking-[-0.03em] font-[500] text-black">Office
                                Location</p>
                            <p class="text-[15px] leading-[1.3em] tracking-[-0.03em] font-[500] text-[#616161]">245
                                Madison Avenue, Suite 1200 New York, NY 10016</p>
                        </div>

                        <!-- Hours -->
                        <div class="flex flex-col gap-[14px]">
                            <p class="text-[14px] leading-[1.2em] tracking-[-0.03em] font-[500] text-black">Business
                                Hours</p>
                            <div class="flex flex-col gap-[10px]">
                                <div class="flex items-center justify-between gap-[10px]">
                                    <p class="text-[15px] tracking-[-0.03em] font-[500] text-black">Monday — Friday</p>
                                    <p class="text-[14px] tracking-[-0.03em] font-[500] text-[#616161]">9:00 AM — 6:00
                                        PM</p>
                                </div>
                                <div class="flex items-center justify-between gap-[10px]">
                                    <p class="text-[15px] tracking-[-0.03em] font-[500] text-black">Saturday</p>
                                    <p class="text-[14px] tracking-[-0.03em] font-[500] text-[#616161]">10:00 AM — 2:00
                                        PM</p>
                                </div>
                                <div class="flex items-center justify-between gap-[10px]">
                                    <p class="text-[15px] tracking-[-0.03em] font-[500] text-black">Sunday</p>
                                    <p class="text-[14px] tracking-[-0.03em] font-[500] text-[#616161]">Closed</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Contact Form -->
                <div class="relative flex-1 w-full">
                    <form class="flex flex-col gap-[20px] sm:gap-[24px]">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-[20px] sm:gap-[16px]">
                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Full Name</p>
                                <input type="text" name="Name" placeholder="Jane Smith"
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black placeholder:text-[#a3a3a3] outline-none focus:border-black/30" />
                            </label>

                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Business Email</p>
                                <input type="email" name="Email" placeholder="jane@framer.com"
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black placeholder:text-[#a3a3a3] outline-none focus:border-black/30" />
                            </label>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-[20px] sm:gap-[16px]">
                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Phone Number</p>
                                <input type="tel" name="Phone" placeholder="(+12) 345 678"
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black placeholder:text-[#a3a3a3] outline-none focus:border-black/30" />
                            </label>

                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Company Name</p>
                                <input type="text" name="Company Name" placeholder="Semono Inovtech"
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black placeholder:text-[#a3a3a3] outline-none focus:border-black/30" />
                            </label>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-[20px] sm:gap-[16px]">
                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Service Required</p>
                                <select name="Service" required
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black outline-none focus:border-black/30">
                                    <option value="" disabled selected>Select consulting service</option>
                                    <option value="Business Strategy">Business Strategy</option>
                                    <option value="Operational Consulting">Operational Consulting</option>
                                    <option value="Leadership Advisory">Leadership Advisory</option>
                                    <option value="Corporate Transformation">Corporate Transformation</option>
                                    <option value="Financial Advisory">Financial Advisory</option>
                                    <option value="Brand & Market Consulting">Brand & Market Consulting</option>
                                    <option value="Process Optimization">Process Optimization</option>
                                    <option value="Organizational Growth">Organizational Growth</option>
                                </select>
                            </label>

                            <label class="flex flex-col gap-[8px]">
                                <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Project Budget</p>
                                <select name="Budget" required
                                    class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black outline-none focus:border-black/30">
                                    <option value="" disabled selected>Select estimated project budget</option>
                                    <option value="Under $5,000">Under $5,000</option>
                                    <option value="$5,000 — $10,000">$5,000 — $10,000</option>
                                    <option value="$10,000 — $25,000">$10,000 — $25,000</option>
                                    <option value="$25,000+">$25,000+</option>
                                </select>
                            </label>
                        </div>

                        <label class="flex flex-col gap-[8px]">
                            <p class="text-[13px] tracking-[-0.03em] font-[500] text-black">Project Details</p>
                            <textarea name="Cover letter"
                                placeholder="Tell us about your business goals, operational challenges, or consulting requirements"
                                rows="5"
                                class="w-full rounded-[5px] border border-[#ebebeb] bg-white px-[16px] py-[12px] text-[14px] text-black placeholder:text-[#a3a3a3] outline-none focus:border-black/30 resize-none"></textarea>
                        </label>

                        <button type="submit"
                            class="w-full rounded-[5px] bg-[#E4FE00] px-[20px] py-[14px] text-[15px] font-[500] tracking-[-0.03em] text-[#0F3D3A] cursor-pointer">
                            Send inquiry
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
